[project]
name = "casefile"
version = "0.1.0"
description = "Autonomous forensic-audit agent: tip + ledger + vendors + staff -> cited, verifiable case file"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer",
    "httpx",
    "tenacity",
    "pandas",
    "python-dateutil",
    "charset-normalizer",
    "rapidfuzz",
    "cleanco",
    "networkx",
    "jinja2",
    "rfc8785",
    "anthropic",
    "python-dotenv",
    "rich",
    "streamlit",
]

[project.scripts]
casefile = "casefile.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/casefile/cli.py" = ["B008"]  # typer.Option in defaults is the Typer idiom
